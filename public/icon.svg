<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0a0a0a; }
      .fg { fill: white; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: white; }
      .fg { fill: #0a0a0a; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="37" />
  <!-- Ticket icon: rectangle with notches -->
  <rect class="fg" x="40" y="55" width="100" height="70" rx="10" />
  <circle class="bg" cx="40" cy="90" r="10" />
  <circle class="bg" cx="140" cy="90" r="10" />
  <!-- Dashed line between notches -->
  <line x1="90" y1="60" x2="90" y2="68" stroke="currentColor" stroke-width="3" class="bg" />
  <line x1="90" y1="74" x2="90" y2="82" stroke="currentColor" stroke-width="3" class="bg" />
  <line x1="90" y1="88" x2="90" y2="96" stroke="currentColor" stroke-width="3" class="bg" />
  <line x1="90" y1="102" x2="90" y2="110" stroke="currentColor" stroke-width="3" class="bg" />
  <line x1="90" y1="114" x2="90" y2="120" stroke="currentColor" stroke-width="3" class="bg" />
</svg>
